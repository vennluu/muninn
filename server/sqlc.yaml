version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "pkg/database/sql"
      - "pkg/features/shared/queries.sql"
      - "pkg/features/auth/queries.sql"
    schema: "migrations"
    gen:
      go:
        package: "database"
        sql_package: "database/sql"
        out: "pkg/database"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
